# Monaco Editor Nginx 配置示例

# 示例1: 部署在根路径 (http://domain.com/)
server {
    listen 80;
    server_name your-domain.com;

    # 前端静态文件根目录
    root /path/to/your/dist;
    index index.html;

    # 配置MIME类型（重要！）
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 主应用路由
    location / {
        try_files $uri $uri/ /index.html;

        # 添加CORS头（如果需要）
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        # 禁用缓存（用于测试，生产环境应该启用缓存）
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Monaco Editor worker文件特殊配置
    location /monacoeditorwork/ {
        # 确保正确的MIME类型
        types {
            application/javascript js;
        }

        # 添加CORS头（重要！Worker可能需要）
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;

        # 缓存配置（生产环境）
        # expires 1y;
        # add_header Cache-Control "public, immutable";

        # 测试环境：禁用缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # 静态资源
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# 示例2: 部署在子路径 (http://domain.com/app/)
server {
    listen 80;
    server_name your-domain.com;

    # 子路径配置
    location /app/ {
        alias /path/to/your/dist/;
        try_files $uri $uri/ /app/index.html;

        # 配置MIME类型
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # 禁用缓存（测试用）
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Monaco Editor worker文件
    location /app/monacoeditorwork/ {
        alias /path/to/your/dist/monacoeditorwork/;

        types {
            application/javascript js;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}

# 重要配置说明：
#
# 1. MIME类型配置
#    - 确保nginx.conf包含: include /etc/nginx/mime.types;
#    - 或者手动添加: types { application/javascript js; }
#
# 2. CORS配置
#    - Worker文件可能需要CORS头
#    - 添加 Access-Control-Allow-Origin 头
#
# 3. 路径配置
#    - 根路径部署：直接使用 root /path/to/dist;
#    - 子路径部署：使用 alias 并确保路径末尾有 /
#
# 4. 缓存配置
#    - 测试阶段：完全禁用缓存（no-store, no-cache）
#    - 生产环境：为静态资源启用长期缓存
#
# 5. 测试步骤
#    - 重启nginx: sudo systemctl restart nginx
#    - 清除浏览器缓存：Ctrl+Shift+Delete
#    - 测试worker文件：curl http://domain.com/monacoeditorwork/editor.worker.bundle.js
#    - 检查nginx日志：tail -f /var/log/nginx/error.log
